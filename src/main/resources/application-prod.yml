# ============================================================================
# Профиль production. Все параметры подключения ОБЯЗАНЫ приходить из окружения.
# Без секретов, без демо-учётных данных, безопасные значения по умолчанию.
# ============================================================================
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${KEYCLOAK_ISSUER_URI}

# Строгие security-заголовки. CORS здесь намеренно не открыт; настраивайте его
# явно для разрешённых origins только тогда, когда есть браузерный клиент.
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    remoteip:
      protocol-header: X-Forwarded-Proto

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.show-details: never

# Структурированное JSON-логирование в stdout для агрегации логов контейнера.
logging:
  level:
    root: INFO
    com.example.logistics: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z',UTC} %-5level [traceId=%X{traceId:-},spanId=%X{spanId:-},correlationId=%X{correlationId:-}] %logger{36} - %msg%n"
