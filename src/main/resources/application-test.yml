# ============================================================================
# Тестовый профиль. DATABASE_URL / RABBITMQ_* подставляются Testcontainers в
# интеграционных тестах; значения по умолчанию ниже указывают на docker-compose
# стек для ручных smoke-прогонов.
# ============================================================================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shipments_test
    username: shipment
    password: shipment
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  jpa:
    hibernate.ddl-auto: validate
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# В тестах проверка JWT может быть ослаблена в helpers JwtIntegrationTests;
# этот issuer-uri соответствует issuer, выдаваемому Testcontainers Keycloak.
spring.security.oauth2.resourceserver.jwt:
  issuer-uri: http://localhost:8000/realms/logistics

# Ускоряем опрос outbox, чтобы интеграционные тесты потока сообщений были быстрыми.
app:
  outbox:
    poll-interval-ms: 100
  rabbitmq:
    prefetch: 10
    max-attempts: 3

logging:
  level:
    com.example.logistics: INFO
