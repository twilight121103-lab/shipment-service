# ============================================================================
# Профиль локальной разработки. Демо-учётные данные специально слабые и помечены
# как ТОЛЬКО ДЛЯ РАЗРАБОТКИ. Не используйте эти значения в production.
# ============================================================================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shipments
    username: shipment
    password: shipment
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jpa:
    hibernate.ddl-auto: validate
    show-sql: false

# Keycloak запускается docker-compose на порту 8000 (см. docker-compose.yml).
spring.security.oauth2.resourceserver.jwt:
  issuer-uri: http://localhost:8000/realms/logistics

app:
  openapi:
    oauth:
      token-url: http://localhost:8000/realms/logistics/protocol/openid-connect/token

logging:
  level:
    com.example.logistics: DEBUG
